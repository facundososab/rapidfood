[project]
name = "rapidfood"
version = "0.1.0"
description = "Rapidfood — Django 5/DRF HTTP shell + Prisma Client Python data layer (hexagonal, 5 apps)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "prisma>=0.15",
    "psycopg[binary]>=3.2",
    "requests>=2.34.2",
    "shapely>=2.0",
    "openrouteservice>=2.3",
]

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "pytest>=8.0",
    "pytest-django>=4.8",
]

# ---------------------------------------------------------------------------
# import-linter (v2.x) — architecture gates.
# Notes on v2 semantics (verified against installed import-linter 2.13/grimp):
# - `as_packages = true` treats modules as packages: descendant modules are
#   covered by the check. `as_packages = false` would only check the package
#   __init__ module and silently miss every real violation.
# - `unmatched_ignore_imports_alerting = "warn"`: the scaffold has no cross-app
#   imports yet, so every whitelist entry is unmatched; v2 default is ERROR
#   (MissingImport). Warn keeps the gate green until real port edges appear.
# - `include_external_packages` is a session option (graph level), NOT a
#   contract option.
# - There is no `acyclic` contract type in v2; `acyclic_siblings` checks that
#   the children of each ancestor (the 5 apps under `apps`) have no import
#   cycles. That is the exact intent of the design's "No circular imports
#   between apps".
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "modules"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers inside each app"
type = "layers"
containers = [
  "modules.client", "modules.conversation", "modules.order", "modules.catalog", "modules.config_coupon", "modules.delivery",
]
layers = [
  "(infrastructure.adapters.driver)",   # DRF views/serializers (highest)
  "(infrastructure.adapters.driven)",   # Prisma repositories/gateways
  "(application.use_cases)",            # orchestration (implements driver ports)
  "(application.ports.driver)",         # driver port interfaces
  "(application.ports.driven)",         # driven port interfaces
  "(domain)",                           # pure domain (lowest)
]
# NOTE: composition/ is intentionally outside this contract — it is the wiring root.
# If lint-imports flags composition imports, add "composition" as the top layer.

[[tool.importlinter.contracts]]
name = "No driver adapter to driven adapter (views never touch the DB)"
type = "forbidden"
source_modules = ["modules.*.adapters.driver"]
forbidden_modules = ["modules.*.adapters.driven"]
as_packages = true

[[tool.importlinter.contracts]]
name = "Domain, ports and use cases must not import frameworks"
type = "forbidden"
source_modules = [
  "modules.*.domain",
  "modules.*.application.ports",
  "modules.*.application.use_cases",
]
forbidden_modules = ["django", "rest_framework", "prisma"]
as_packages = true

# --- One per app; forbids ONLY the 4 sibling apps (no self-import false positives) ---
# Whitelisted edges use `**` so they match imports from ANY module of the app
# to ANY module under the sibling's application.ports subtree.
[[tool.importlinter.contracts]]
name = "conversation consumes siblings only via application.ports"
type = "forbidden"
source_modules = ["modules.conversation"]
forbidden_modules = ["modules.order", "modules.client", "modules.catalog", "modules.config_coupon"]
as_packages = true
unmatched_ignore_imports_alerting = "warn"
ignore_imports = [
  "modules.conversation.** -> modules.order.application.ports.**",
  "modules.conversation.** -> modules.client.application.ports.**",
  "modules.conversation.** -> modules.catalog.application.ports.**",
  "modules.conversation.** -> modules.config_coupon.application.ports.**",
]

[[tool.importlinter.contracts]]
name = "order consumes siblings only via application.ports"
type = "forbidden"
source_modules = ["modules.order"]
forbidden_modules = ["modules.client", "modules.catalog", "modules.config_coupon"]
as_packages = true
unmatched_ignore_imports_alerting = "warn"
ignore_imports = [
  "modules.order.** -> modules.client.application.ports.**",
  "modules.order.** -> modules.catalog.application.ports.**",
  "modules.order.** -> modules.config_coupon.application.ports.**",
]

[[tool.importlinter.contracts]]
name = "client consumes siblings only via application.ports"
type = "forbidden"
source_modules = ["modules.client"]
forbidden_modules = ["modules.conversation", "modules.order", "modules.catalog", "modules.config_coupon"]
as_packages = true

[[tool.importlinter.contracts]]
name = "catalog consumes siblings only via application.ports"
type = "forbidden"
source_modules = ["modules.catalog"]
forbidden_modules = ["modules.client", "modules.conversation", "modules.order", "modules.config_coupon"]
as_packages = true

[[tool.importlinter.contracts]]
name = "config_coupon consumes siblings only via application.ports"
type = "forbidden"
source_modules = ["modules.config_coupon"]
forbidden_modules = ["modules.client", "modules.conversation", "modules.order", "modules.catalog"]
as_packages = true

[[tool.importlinter.contracts]]
name = "delivery consumes siblings only via application.ports"
type = "forbidden"
source_modules = ["modules.delivery"]
forbidden_modules = ["modules.client", "modules.catalog", "modules.config_coupon", "modules.order", "modules.conversation"]
as_packages = true
unmatched_ignore_imports_alerting = "warn"
ignore_imports = [
  "modules.delivery.** -> modules.order.application.ports.**",
]

[[tool.importlinter.contracts]]
name = "No circular imports between apps"
type = "acyclic_siblings"
ancestors = ["modules"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["api"]              # makes `modules.*` and `config.*` importable
testpaths = ["tests", "api/modules", "api/shared/infrastructure/prisma/tests"]
addopts = "-ra --strict-markers"
markers = [
  "db: test that requires the Prisma-managed test database",
]
