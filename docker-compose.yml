services:
  db:
    image: postgres:16
    container_name: rapidfood_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rapidfood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rapidfood}
      POSTGRES_DB: ${POSTGRES_DB:-rapidfood}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rapidfood} -d ${POSTGRES_DB:-rapidfood}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: rapidfood_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rapidfood}:${POSTGRES_PASSWORD:-rapidfood}@db:5432/${POSTGRES_DB:-rapidfood}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key}
      # Delivery routing (read by api/config/settings.py). Set in the repo-root .env.
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
      # MercadoPago integrates into the order module and reads these from env;
      # MERCADOPAGO_ACCESS_TOKEN is required for the app to boot. Set the real
      # values in the repo-root .env (empty keeps the stack running without them).
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_NOTIFICATION_URL: ${MERCADOPAGO_NOTIFICATION_URL:-https://hypsicephalic-decisive-lavette.ngrok-free.dev/api/orders/payments/mercadopago/webhook/}
      MERCADOPAGO_SUCCESS_URL: ${MERCADOPAGO_SUCCESS_URL:-}
      MERCADOPAGO_FAILURE_URL: ${MERCADOPAGO_FAILURE_URL:-}
      MERCADOPAGO_PENDING_URL: ${MERCADOPAGO_PENDING_URL:-}
      MERCADOPAGO_CURRENCY: ${MERCADOPAGO_CURRENCY:-ARS}
      # Conversation agent (LangGraph + Groq). Optional: without a key the
      # agent endpoint returns a clear 503 and the rest of the app keeps working.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-llama-3.3-70b-versatile}
      AGENT_BUSINESS_CONFIG_ID: ${AGENT_BUSINESS_CONFIG_ID:-}
      # LangSmith tracing (optional).
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-rapidfood-agent}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # Dev: bind-mount the source so runserver auto-reloads on edits.
    # Target the subdirs only: /app must keep the baked pyproject/uv.lock/venv
    # that `uv run` resolves from. Rebuild the image for new Python deps.
    volumes:
      - ./api/config:/app/config
      - ./api/manage.py:/app/manage.py
      - ./api/modules:/app/modules
      - ./api/shared:/app/shared
      - ./api/composition:/app/composition

  ui:
    build: ./ui
    container_name: rapidfood_ui
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      # This stack runs the panel against the real backend. Fixed values on
      # purpose: the repo-root .env (loaded by compose) still sets
      # RAPIDFOOD_CLIENT=mock for standalone local dev.
      RAPIDFOOD_CLIENT: http
      RAPIDFOOD_API_BASE_URL: http://backend:8000
    ports:
      - "${UI_PORT:-8001}:8000"
    # Dev: the whole ./ui dir is the container /app (same layout as the image).
    volumes:
      - ./ui:/app

  # Single public entrypoint: routes /api/ to the backend (webhook) and the
  # rest to the admin panel, so one ngrok domain serves both.
  proxy:
    image: nginx:alpine
    container_name: rapidfood_proxy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      ui:
        condition: service_started
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # Public HTTPS tunnel for Mercado Pago callbacks. MP must reach the backend
  # webhook from the public internet, so this forwards the reserved ngrok domain
  # to the proxy. Requires NGROK_AUTHTOKEN in the repo-root .env; the domain
  # must be reserved on the ngrok dashboard.
  ngrok:
    image: ngrok/ngrok:latest
    container_name: rapidfood_ngrok
    restart: unless-stopped
    depends_on:
      proxy:
        condition: service_started
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command:
      - http
      - proxy:80
      - --url=https://${NGROK_DOMAIN:-hypsicephalic-decisive-lavette.ngrok-free.dev}
      - --log=stdout

volumes:
  pgdata:
