<div class="card overflow-hidden"><form class="p-4 border-b border-line flex gap-2" hx-get="{% url 'products_table' %}" hx-target="#products-table" hx-trigger="keyup delay:400ms from:input, change"><input class="field max-w-sm" name="q" value="{{ request.GET.q }}" placeholder="Buscar producto"><select class="field w-auto" name="category"><option value="">Todas las categorías</option>{% for c in categories %}<option value="{{ c.id }}" {% if request.GET.category == c.id %}selected{% endif %}>{{ c.description }}</option>{% endfor %}</select></form><table class="w-full"><thead class="bg-muted"><tr><th class="th px-5 py-3">Producto</th><th class="th px-4 py-3">Categoría</th><th class="th px-4 py-3">Disponibilidad</th><th class="th px-5 py-3 text-right">Acción</th></tr></thead><tbody>{% for p in products.items %}<tr class="row-link border-t border-line"><td class="px-5 py-3"><a href="{% url 'product_detail' p.id %}" class="text-[13px] font-semibold hover:text-primary">{{ p.description }}</a></td><td class="px-4 py-3 text-[13px] text-ink-muted">{{ p.category.description }}</td><td class="px-4 py-3"><span class="badge {% if p.available %}bg-success-soft text-success{% else %}bg-neutral-soft text-neutral{% endif %}">{{ p.available|yesno:'Disponible,No disponible' }}</span></td><td class="px-5 py-3 text-right"><a class="text-[12px] font-semibold text-primary" href="{% url 'product_detail' p.id %}">Ver detalle</a></td></tr>{% endfor %}</tbody></table>{% include 'components/pagination.html' with page=products target='#products-table' %}</div>
