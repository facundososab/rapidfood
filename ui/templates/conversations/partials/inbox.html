{% comment %}Columna izquierda: la bandeja de conversaciones.{% endcomment %}
<aside class="chat-inbox" x-data="{ q: '', tab: 'all' }">
  <div class="chat-inbox-head">
    <div>
      <div class="chat-eyebrow">Bandeja</div>
      <div class="chat-title">Conversaciones <span class="chat-title-count">{{ conversations|length }}</span></div>
    </div>
    <a href="{% url 'conversations' %}" class="chat-icon-btn" title="Actualizar">{% icon 'plus' 'w-4 h-4' %}</a>
  </div>

  <div class="chat-search">
    <label class="chat-search-field">
      {% icon 'search' 'w-4 h-4' %}
      <input x-model="q" placeholder="Buscar conversación" autocomplete="off">
    </label>
    <button type="button" class="chat-icon-btn" title="Filtrar">{% icon 'filter' 'w-4 h-4' %}</button>
  </div>

  <div class="chat-tabs">
    <button type="button" class="chat-tab" :class="tab === 'all' && 'active'" @click="tab = 'all'">
      Todas <em>{{ conversations|length }}</em>
    </button>
    <button type="button" class="chat-tab" :class="tab === 'unassigned' && 'active'" @click="tab = 'unassigned'">
      Sin cliente <em>{{ unassigned_count }}</em>
    </button>
  </div>

  <div class="chat-list">
    {% for c in conversations %}
    <button type="button"
            class="chat-item {% if conversation and c.id == conversation.id %}active{% endif %}"
            data-search="{{ c.clientName|default:'Cliente sin identificar' }} {{ c.lastMessage|default:'' }}"
            data-assigned="{% if c.clientId %}1{% else %}0{% endif %}"
            x-show="(tab === 'all' || $el.dataset.assigned === '0') && (q === '' || $el.dataset.search.toLowerCase().includes(q.toLowerCase()))"
            hx-get="{% url 'conversation_detail' c.id %}"
            hx-target="#conversation-pane" hx-swap="outerHTML" hx-push-url="true">
      {% cycle '#ede9fe' '#dbeafe' '#dcfce7' '#fef3c7' '#ffe4e6' as avatar_bg silent %}
      <span class="chat-avatar" style="background: {{ avatar_bg }}">{{ c.clientName|default:'?'|initials }}</span>
      <span class="chat-item-body">
        <span class="flex items-center justify-between gap-2">
          <span class="chat-name truncate">{{ c.clientName|default:'Cliente sin identificar' }}</span>
          <span class="chat-item-meta whitespace-nowrap">{% if c.lastAt %}{{ c.lastAt|time_ago }}{% endif %}</span>
        </span>
        <span class="chat-preview block">{{ c.lastMessage|default:'Sin actividad registrada' }}</span>
        <span class="chat-item-tags">
          <span class="chat-tag-green">{{ c.channel }}</span>
          {% if c.agentPaused %}<span class="chat-tag-green" style="background:#fef3c7;color:#b45309">Atiende un humano</span>{% endif %}
        </span>
      </span>
      <span class="chat-unread" title="{{ c.messageCount }} mensajes">{{ c.messageCount }}</span>
    </button>
    {% empty %}
    <div class="p-6 text-[13px] text-ink-faint">No hay conversaciones todavía.</div>
    {% endfor %}
  </div>
</aside>
