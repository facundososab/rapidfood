{# Nuevo cupón — reusable form (rendered inside a modal). #}
<form
  method="post"
  action="{% url 'coupon_save' %}"
  x-data="{ type: 'PERCENTAGE', amount: '', singleUse: true, sinMinimo: true, uses: 2 }"
  x-effect="if (type === 'FIXED_AMOUNT') sinMinimo = false"
  class="p-5 grid sm:grid-cols-2 gap-5"
>
  {% csrf_token %}

  <div>
    <label class="th block mb-2">Código</label>
    <input name="coupon_code" class="field font-mono uppercase" placeholder="BIENVENIDA10" required />
  </div>

  <div>
    <span class="th block mb-2">Usos disponibles</span>
    <label class="inline-flex items-center gap-2 cursor-pointer">
      <input type="checkbox" x-model="singleUse" class="rounded text-primary focus:ring-primary" />
      <span class="text-[14px] font-medium text-ink">Único uso</span>
    </label>

    <div x-show="!singleUse" class="flex items-center gap-2 mt-3">
      <button
        type="button"
        class="btn btn-ghost !px-2.5"
        @click="uses = Math.max(2, (parseInt(uses) || 2) - 1)"
        aria-label="Quitar uno"
      >
        {% icon 'minus' 'w-4 h-4' %}
      </button>
      <input
        type="number"
        min="2"
        x-model.number="uses"
        @change="uses = Math.max(2, parseInt(uses) || 2)"
        class="field w-24 text-center font-mono"
      />
      <button
        type="button"
        class="btn btn-ghost !px-2.5"
        @click="uses = (parseInt(uses) || 2) + 1"
        aria-label="Sumar uno"
      >
        {% icon 'plus' 'w-4 h-4' %}
      </button>
      <span class="text-[12px] text-ink-faint">mínimo 2</span>
    </div>

    <input type="hidden" name="available_uses" :value="singleUse ? 1 : uses" />
  </div>

  <div>
    <span class="th block mb-2">Tipo</span>
    <div class="flex flex-col gap-2">
      <label class="inline-flex items-center gap-2 cursor-pointer">
        <input type="radio" name="type" value="FIXED_AMOUNT" x-model="type" class="text-primary focus:ring-primary" />
        <span class="text-[14px] font-medium text-ink">Monto fijo</span>
      </label>
      <label class="inline-flex items-center gap-2 cursor-pointer">
        <input type="radio" name="type" value="PERCENTAGE" x-model="type" class="text-primary focus:ring-primary" />
        <span class="text-[14px] font-medium text-ink">Porcentaje</span>
      </label>
    </div>
  </div>

  <div>
    <label class="th block mb-2">
      <span x-text="type === 'PERCENTAGE' ? 'Porcentaje (%)' : 'Monto'">Monto</span>
    </label>
    <input
      name="amount"
      type="number"
      min="0"
      :max="type === 'PERCENTAGE' ? 100 : null"
      step="0.01"
      class="field"
      x-model.number="amount"
      required
    />
    <p
      x-show="type === 'PERCENTAGE' && amount > 100"
      style="display: none"
      class="mt-1.5 text-[12px] text-danger font-medium"
    >
      El porcentaje no puede ser mayor a 100.
    </p>
  </div>

  <div>
    <span class="th block mb-2">Pedido mínimo</span>
    <label class="inline-flex items-center gap-2 cursor-pointer">
      <input
        type="checkbox"
        x-model="sinMinimo"
        :disabled="type === 'FIXED_AMOUNT'"
        class="rounded text-primary focus:ring-primary"
      />
      <span class="text-[14px] font-medium text-ink">Sin mínimo</span>
    </label>

    <div x-show="!sinMinimo" class="mt-3">
      <input
        name="min_order_amount"
        type="number"
        min="0"
        step="0.01"
        class="field"
        placeholder="Ej: 5000"
        :disabled="sinMinimo"
        :required="!sinMinimo"
      />
    </div>
  </div>

  <div>
    <label class="th block mb-2">Fecha de vencimiento <span class="normal-case font-normal">(opcional)</span></label>
    <input name="date_of_expiration" type="date" class="field" />
  </div>

  <div class="sm:col-span-2 flex justify-end gap-2">
    <button type="button" class="btn btn-ghost" @click="newCoupon = false">Cancelar</button>
    <button class="btn btn-primary">Crear cupón</button>
  </div>
</form>
