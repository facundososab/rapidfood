{% extends 'base.html' %}{% block title %}Nuevo cupón{% endblock %}{% block heading %}Nuevo cupón{% endblock %}{% block content %}<form method="post" action="{% url 'coupon_save' %}" class="card max-w-2xl p-6 grid sm:grid-cols-2 gap-5">{% csrf_token %}<div><label class="th block mb-2">Código</label><input name="coupon_code" class="field font-mono uppercase" placeholder="BIENVENIDA10" required></div><div><label class="th block mb-2">Tipo</label><select name="type" class="field"><option value="FIXED_AMOUNT">Monto fijo</option><option value="PERCENTAGE">Porcentaje</option></select></div><div><label class="th block mb-2">Monto</label><input name="amount" type="number" min="0" step="0.01" class="field" required></div><div><label class="th block mb-2">Usos disponibles</label><input name="available_uses" type="number" min="0" class="field" required></div><div class="sm:col-span-2"><label class="th block mb-2">Fecha de vencimiento <span class="normal-case font-normal">(opcional)</span></label><input name="date_of_expiration" type="date" class="field"></div><div class="sm:col-span-2"><button class="btn btn-primary">Crear cupón</button></div></form>{% endblock %}
