{% comment %}icon title message (optional){% endcomment %}
<div class="flex flex-col items-center justify-center text-center py-14 px-6">
  <div class="w-11 h-11 rounded-full bg-subtle grid place-items-center text-ink-faint mb-3">
    {% include 'components/icon.html' with name=icon|default:'inbox' cls='w-5 h-5' %}
  </div>
  <div class="text-[14px] font-semibold text-ink">{{ title }}</div>
  {% if message %}<div class="text-[13px] text-ink-muted mt-1 max-w-sm">{{ message }}</div>{% endif %}
  {% block empty_action %}{% endblock %}
</div>
