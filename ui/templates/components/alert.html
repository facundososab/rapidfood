{% if error %}<div data-alert class="mb-4"><div class="card flex items-start gap-3 p-4" style="background:var(--color-danger-soft);border-color:var(--color-danger)"><span class="mt-0.5 shrink-0" style="color:var(--color-danger)">{% include 'components/icon.html' with name='alert-triangle' cls='w-4 h-4' %}</span><div class="min-w-0 flex-1 text-[13px] font-medium leading-snug" style="color:var(--color-danger)">{{ error }}</div><button type="button" class="btn btn-ghost !px-1.5 shrink-0" onclick="this.closest('[data-alert]').remove()" aria-label="Cerrar">{% include 'components/icon.html' with name='x' cls='w-4 h-4' %}</button></div></div>{% endif %}
