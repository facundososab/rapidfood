<div class="card overflow-hidden"><form class="p-4 border-b border-line" hx-get="{% url 'clients_table' %}" hx-target="#clients-table" hx-trigger="keyup delay:400ms from:input"><input name="q" value="{{ request.GET.q }}" class="field max-w-sm" placeholder="Buscar por nombre o teléfono"></form><table class="w-full"><thead class="bg-muted"><tr><th class="th px-5 py-3">Cliente</th><th class="th px-4 py-3">Teléfono</th><th class="th px-4 py-3 text-right">Pedidos</th><th class="th px-4 py-3 text-right">Total gastado</th><th class="th px-5 py-3">Último pedido</th></tr></thead><tbody>{% for c in clients.items %}<tr class="row-link border-t border-line"><td class="px-5 py-3"><a href="{% url 'client_detail' c.id %}" class="text-[13px] font-semibold">{{ c|client_name }}</a></td><td class="px-4 py-3 font-mono text-[12px] text-ink-muted">{{ c.phoneNumber }}</td><td class="px-4 py-3 text-right text-[13px]">—</td><td class="px-4 py-3 text-right font-mono text-[13px]">—</td><td class="px-5 py-3 text-[12px] text-ink-muted">Ver detalle</td></tr>{% endfor %}</tbody></table>{% include 'components/pagination.html' with page=clients target='#clients-table' %}</div>
