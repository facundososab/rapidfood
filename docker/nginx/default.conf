# Single public entrypoint for the ngrok tunnel.
#
# Mercado Pago needs one public HTTPS URL that serves both the payment webhook
# (backend) and the buyer return page (admin panel). This routes /api/ and
# /health/ to the backend and everything else to the UI.

# ngrok terminates TLS and forwards plain HTTP, so $scheme is always "http" here.
# Preserve ngrok's X-Forwarded-Proto when present; fall back to $scheme for
# direct/local requests.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Backend (hexagonal HTTP shell): REST API + health probe. Includes the
    # Mercado Pago webhook at /api/orders/payments/mercadopago/webhook/.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /health/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Everything else: the admin panel (HTMX/Tailwind) and its static assets.
    location / {
        proxy_pass http://ui:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
